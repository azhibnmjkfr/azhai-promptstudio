<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="180" r="140" fill="url(#accent)" opacity="0.15" filter="url(#glow)"/>

  <!-- Logo layers (3 stacked shapes) -->
  <g fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M256 116 L136 176 L256 236 L376 176 Z"/>
    <path d="M136 256 L256 316 L376 256"/>
    <path d="M136 336 L256 396 L376 336"/>
  </g>

  <!-- Center dot -->
  <circle cx="256" cy="176" r="14" fill="#ffffff" opacity="0.9"/>
</svg>